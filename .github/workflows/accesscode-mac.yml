# Taylor's Access Code Labs experimental Mac prereleases.
# Repository secrets:
#   APPLE_SIGNING_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_SIGNING_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_NOTARY_KEY                    contents of the App Store Connect API key (.p8) used for notarization
#   APPLE_NOTARY_KEY_ID                 that key's ID
#   APPLE_NOTARY_ISSUER_ID              that key's issuer ID
#   ACCESSCODE_GITHUB_CLIENT_SECRET     GitHub OAuth app secret the GitHub MCP sign-in uses (optional)
name: Taylor's Access Code Labs Mac beta

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: labs-mac-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    if: github.repository == 'taylorarndt/taylors-access-code-labs' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    environment: accesscode-beta
    env:
      OPENCODE_TARGET: darwin-arm64
      # The voice helper requires Swift 6.2; macos-15 defaults to Xcode 16.4 (Swift 6.1).
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check Apple signing credentials
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for key in APPLE_SIGNING_CERTIFICATE APPLE_SIGNING_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Configure the $key secret for the Labs Mac beta."
              exit 1
            fi
          done

      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Choose version and channel
        run: |
          base=$(jq -r .version packages/desktop/package.json)
          version="$base-beta.$GITHUB_RUN_NUMBER" channel=beta tag="labs-mac-$base-beta.$GITHUB_RUN_NUMBER"
          {
            echo "OPENCODE_VERSION=$version"
            echo "OPENCODE_CHANNEL=$channel"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"
          echo "Building AccessCode $version ($channel)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=darwin --cpu=arm64

      - name: Build the CLI
        working-directory: packages/cli
        run: bun run build --single && rm -rf dist/.bun
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ github.token }}

      - name: Build the app
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ACCESSCODE_GITHUB_CLIENT_SECRET: ${{ secrets.ACCESSCODE_GITHUB_CLIENT_SECRET }}

      - name: Prepare Sparkle distribution
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          cd "$RUNNER_TEMP/sparkle"
          curl -fLsS --retry 3 -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  sparkle.tar.xz' | shasum -a 256 -c -
          tar -xf sparkle.tar.xz
          echo "SPARKLE_DISTRIBUTION=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"

      - name: Pack the app
        working-directory: packages/desktop
        timeout-minutes: 60
        run: bun run pack
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}

      - name: Verify Mac app switcher name
        run: |
          name="Taylor's Access Code Labs Beta"
          tar -xOf dist/desktop/opencode-desktop-mac-arm64.app.tar "$name.app/Contents/Info.plist" > "$RUNNER_TEMP/app.plist"
          for key in CFBundleName CFBundleDisplayName; do
            test "$(plutil -extract "$key" raw "$RUNNER_TEMP/app.plist")" = "$name"
          done

      - name: Import the signing certificate
        run: |
          umask 077
          cert="$RUNNER_TEMP/cert.p12"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$cert" -k build.keychain -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain > /dev/null
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

      # Signs inside-out with hardened runtime, notarizes, staples, then makes the zip and dmg.
      - name: Sign and notarize
        run: bash .github/release/sign-desktop-macos.sh "$RUNNER_TEMP/out" dist/desktop/opencode-desktop-mac-arm64.app.tar
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Sign the Labs update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          cp "$RUNNER_TEMP/out/opencode-desktop-mac-arm64.zip" "$RUNNER_TEMP/feed/Taylor.s-Access-Code-Labs-Beta-mac-arm64.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DISTRIBUTION/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" "$RUNNER_TEMP/feed"
          test -s "$RUNNER_TEMP/feed/appcast.xml"
          test -n "$(xmllint --xpath 'string(//enclosure/@*[local-name()="edSignature"])' "$RUNNER_TEMP/feed/appcast.xml")"

      - name: Publish the release
        run: |
          name="Taylor's Access Code Labs Beta"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/out/opencode-desktop-mac-arm64.dmg" "$RUNNER_TEMP/release/$(echo "$name" | tr ' ' '-')-mac-arm64.dmg"
          cp "$RUNNER_TEMP/feed/Taylor.s-Access-Code-Labs-Beta-mac-arm64.zip" "$RUNNER_TEMP/release/"
          flags=(--target "$GITHUB_SHA" --title "$name $OPENCODE_VERSION" --generate-notes)
          flags+=(--prerelease --latest=false)
          gh release create "$RELEASE_TAG" "${flags[@]}" "$RUNNER_TEMP"/release/*
          if gh release view labs-mac-feed >/dev/null 2>&1; then
            gh release upload labs-mac-feed "$RUNNER_TEMP/feed/appcast.xml" --clobber
          else
            gh release create labs-mac-feed --target "$GITHUB_SHA" --title "Labs Mac update feed" --prerelease --latest=false \
              --notes "Update feed for Taylor's Access Code Labs Beta on macOS." "$RUNNER_TEMP/feed/appcast.xml"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain 2> /dev/null || true
